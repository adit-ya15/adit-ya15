
    <svg width="850" height="480" viewBox="0 0 850 480" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
          <stop offset="0%" stop-color="#1f2129"/>
          <stop offset="100%" stop-color="#090a0c"/>
        </radialGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="5" result="blur" />
          <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>

        <linearGradient id="primary-grad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#8a6327"/><stop offset="50%" stop-color="#d4af37"/><stop offset="100%" stop-color="#f5d76e"/>
        </linearGradient>
        <linearGradient id="secondary-grad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#424242"/><stop offset="50%" stop-color="#9e9e9e"/><stop offset="100%" stop-color="#e0e0e0"/>
        </linearGradient>
        <linearGradient id="tertiary-grad" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0%" stop-color="#5d3a1a"/><stop offset="50%" stop-color="#cd7f32"/><stop offset="100%" stop-color="#f5b041"/>
        </linearGradient>
      </defs>

      <style>
        .serif-text { font-family: "Georgia", "Times New Roman", serif; fill: #ffffff; }
        .accent-text { font-family: "Georgia", "Times New Roman", serif; fill: #d4af37; }
        .muted-mono { font-family: "Courier New", monospace; fill: #a1a1aa; }
        .glass-panel { fill: rgba(15, 17, 21, 0.6); stroke: rgba(212, 175, 55, 0.15); stroke-width: 1px; }
        .glass-badge { fill: rgba(212, 175, 55, 0.05); stroke: rgba(212, 175, 55, 0.4); stroke-width: 1px; }
        .bar { animation: rise 1.5s ease-out forwards; transform-origin: bottom; }
        @keyframes rise { 0% { transform: scaleY(0); } 100% { transform: scaleY(1); } }
      </style>

      <rect width="850" height="480" fill="url(#bg-grad)" />

      <ellipse cx="425" cy="40" rx="250" ry="4" fill="#ffffff" filter="url(#glow)" opacity="0.4"/>
      <ellipse cx="425" cy="450" rx="200" ry="4" fill="#d4af37" filter="url(#glow)" opacity="0.3"/>
      <line x1="20" y1="240" x2="830" y2="240" stroke="#d4af37" stroke-width="1" filter="url(#glow)" opacity="0.1" />

      <rect x="40" y="80" width="230" height="340" rx="16" class="glass-panel" />
      <rect x="290" y="80" width="270" height="340" rx="16" class="glass-panel" />
      <rect x="580" y="80" width="230" height="340" rx="16" class="glass-panel" />

      <g transform="translate(155, 120)">
        <text x="0" y="0" text-anchor="middle" class="accent-text" font-size="14" letter-spacing="3">LEGACY</text>
        <line x1="-35" y1="12" x2="35" y2="12" stroke="#d4af37" stroke-width="0.5" opacity="0.5"/>

        <text x="0" y="45" text-anchor="middle" class="serif-text" font-size="16">Total</text>
        <text x="0" y="65" text-anchor="middle" class="serif-text" font-size="16">Contributions</text>

        <text x="0" y="150" text-anchor="middle" class="serif-text" font-size="70" filter="url(#glow)">692</text>
        <text x="0" y="150" text-anchor="middle" class="serif-text" font-size="70">692</text>

        <g transform="translate(0, 205)">
          <rect x="-85" y="-18" width="170" height="26" rx="13" class="glass-badge" />
          <text x="0" y="0" text-anchor="middle" class="muted-mono" font-size="10">Apr 28, 2025 - Present</text>
        </g>
      </g>

      <g transform="translate(425, 120)">
        <g transform="translate(-15, -15)" fill="#ffffff" filter="url(#glow)">
          <path d="M4 16 L0 4 L8 10 L15 0 L22 10 L30 4 L26 16 Z" />
        </g>

        <g transform="translate(0, 95)">
          <circle cx="0" cy="0" r="70" fill="none" stroke="url(#primary-grad)" stroke-width="4" filter="url(#glow)" />
          <circle cx="0" cy="0" r="70" fill="none" stroke="#f5d76e" stroke-width="1.5" />
          
          <g>
             <circle cx="0" cy="0" r="62" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.8"/>
             <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
          </g>

          <g>
             <circle cx="0" cy="0" r="80" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="1 15" opacity="0.5"/>
             <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="30s" repeatCount="indefinite" />
          </g>

          <text x="0" y="18" text-anchor="middle" class="serif-text" font-size="55">0</text>
        </g>

        <g transform="translate(0, 205)">
          <text x="0" y="0" text-anchor="middle" class="accent-text" font-size="12" letter-spacing="2">CURRENT STREAK</text>
          <rect x="-85" y="10" width="170" height="22" rx="11" class="glass-badge" />
          <text x="0" y="25" text-anchor="middle" class="muted-mono" font-size="10">No active streak</text>
        </g>

        <g transform="translate(0, 260)">
          <rect x="-115" y="0" width="230" height="55" rx="10" class="glass-badge" fill="rgba(212, 175, 55, 0.05)"/>
          <text x="-100" y="22" text-anchor="start" class="serif-text" font-size="11" letter-spacing="1">LONGEST STREAK</text>
          <text x="100" y="25" text-anchor="end" class="accent-text" font-size="22">10</text>
          <line x1="-100" y1="32" x2="100" y2="32" stroke="rgba(212, 175, 55, 0.15)" stroke-width="1" />
          <text x="0" y="47" text-anchor="middle" class="muted-mono" font-size="10">Apr 8, 2026 - Apr 17, 2026</text>
        </g>
      </g>

      <g transform="translate(695, 120)">
        <text x="0" y="0" text-anchor="middle" class="accent-text" font-size="14" letter-spacing="2">THE ARSENAL</text>
        <line x1="-35" y1="12" x2="35" y2="12" stroke="#d4af37" stroke-width="0.5" opacity="0.5"/>
        
        <g transform="translate(-65, 55)">
          <text x="0" y="0" text-anchor="middle" class="serif-text" font-size="12">69%</text>
          <rect x="-10" y="30" width="20" height="100" fill="url(#primary-grad)" class="bar" />
          <g transform="translate(0, 150)">
             <circle cx="0" cy="0" r="8" fill="none" stroke="#d4af37" stroke-width="1"/>
             <rect x="-3" y="-3" width="6" height="6" fill="#d4af37" />
          </g>
          <text x="0" y="175" text-anchor="middle" class="serif-text" font-size="10">JavaScript</text>
        </g>

        <g transform="translate(0, 55)">
          <text x="0" y="0" text-anchor="middle" class="serif-text" font-size="12">16%</text>
          <rect x="-10" y="106.81159420289855" width="20" height="23.18840579710145" fill="url(#secondary-grad)" class="bar" />
          <g transform="translate(0, 150)">
             <circle cx="0" cy="0" r="8" fill="none" stroke="#9e9e9e" stroke-width="1"/>
             <circle cx="0" cy="0" r="3" fill="#9e9e9e" />
          </g>
          <text x="0" y="175" text-anchor="middle" class="serif-text" font-size="10">TypeScript</text>
        </g>

        <g transform="translate(65, 55)">
          <text x="0" y="0" text-anchor="middle" class="serif-text" font-size="12">10%</text>
          <rect x="-10" y="115.5072463768116" width="20" height="14.492753623188406" fill="url(#tertiary-grad)" class="bar" />
          <g transform="translate(0, 150)">
             <circle cx="0" cy="0" r="8" fill="none" stroke="#cd7f32" stroke-width="1"/>
             <polygon points="0,-4 4,3 -4,3" fill="#cd7f32" />
          </g>
          <text x="0" y="175" text-anchor="middle" class="serif-text" font-size="10">CSS</text>
        </g>
      </g>
    </svg>
  